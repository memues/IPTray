name: Build and security checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      matrix:
        store: [false, true]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: 8.0.x
      - name: Restore and reject known vulnerable packages
        run: dotnet restore tests/IPTray.Checks/IPTray.Checks.csproj -p:StoreBuild=${{ matrix.store }} -p:NuGetAudit=true -p:NuGetAuditMode=all -p:NuGetAuditLevel=low -warnaserror:NU1901,NU1902,NU1903,NU1904
      - name: Build regression checks
        run: dotnet build tests/IPTray.Checks/IPTray.Checks.csproj -c Release --no-restore -p:StoreBuild=${{ matrix.store }}
      - name: Run isolated regression checks
        run: dotnet tests/IPTray.Checks/bin/Release/net8.0-windows10.0.19041.0/win-x64/IPTray.Checks.dll
